name: Manage Issue

on:
  issues:
    types: [opened, edited, reopened, labeled]

jobs:
  manage-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Add to Project if label exists
        if: |
          contains(join(github.event.issue.labels.*.name, ','), 'bug') ||
          contains(join(github.event.issue.labels.*.name, ','), 'feature') ||
          contains(join(github.event.issue.labels.*.name, ','), 'task')
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ secrets.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}
          labeled: bug, feature, task

      - name: Update Project Type field
        uses: octokit/graphql-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          query: |
            mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, $optionId:ID!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: { singleSelectOptionId: $optionId }
              }) {
                projectV2Item {
                  id
                }
              }
            }
          variables: |
            {
              "projectId": "PROJECT_ID",
              "itemId": "${{ github.event.issue.node_id }}",
              "fieldId": "TYPE_FIELD_ID",
              "optionId": "OPTION_ID_DEPENDING_ON_LABEL"
            }
